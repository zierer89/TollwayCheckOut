<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#118a45" />
  <title>Illinois Tollway Checkout</title>
  <link rel="stylesheet" href="styles.css?v=7" />
</head>
<body>
  <main id="app">
    <section id="splash" class="screen splash-screen">
      <img src="./illinois-tollway-logo.png?v=7" alt="Illinois Tollway" class="splash-logo" />
    </section>

    <section id="home" class="screen hidden app-screen">
      <header class="topbar">
        <div class="topbar-spacer"></div>
        <h1>Checkout Sheets</h1>
        <div class="topbar-spacer"></div>
      </header>

      <div class="content-wrap">
        <p class="intro">Select a checkout sheet<br>to get started.</p>

        <div class="checkout-list">
          <button class="checkout-btn" data-sheet="tractor"><span class="sheet-icon">🚜</span><span>Tractor Checkout</span><span class="chev">›</span></button>
          <button class="checkout-btn" data-sheet="equipment"><span class="sheet-icon">🏗️</span><span>Equipment Checkout</span><span class="chev">›</span></button>
          <button class="checkout-btn" data-sheet="lane"><span class="sheet-icon">🛣️</span><span>Lane Blade Inspection</span><span class="chev">›</span></button>
          <button class="checkout-btn" data-sheet="help"><span class="sheet-icon">⚠️</span><span>HELP Checkout</span><span class="chev">›</span></button>
          <button class="checkout-btn" data-sheet="sweeper"><span class="sheet-icon">🚛</span><span>Sweeper Checkout</span><span class="chev">›</span></button>
          <button class="checkout-btn" data-sheet="truck"><span class="sheet-icon">🚚</span><span>Truck Checkout</span><span class="chev">›</span></button>
          <button class="checkout-btn" data-sheet="tma"><span class="sheet-icon">🚧</span><span>TMA Checkout</span><span class="chev">›</span></button>
          <button class="checkout-btn" data-sheet="message"><span class="sheet-icon">💬</span><span>Message Board Checkout</span><span class="chev">›</span></button>
        </div>
      </div>
    </section>

    <section id="sheet" class="screen hidden app-screen">
      <header class="topbar detail-bar">
        <button id="backBtn" class="back-btn" type="button">‹</button>
        <h1 id="sheetTitle">Tractor Checkout</h1>
        <div class="topbar-spacer"></div>
      </header>

      <div class="detail-content">
        <div id="bigIcon" class="big-icon">🚜</div>
        <h2 id="detailTitle">Tractor Checkout</h2>
        <div class="rule"></div>
        <p class="coming">This checkout sheet<br>will be available soon.</p>
        <div class="info-card">
          <span class="info-icon">ⓘ</span>
          <span>Forms will be added here.<br>Check back later.</span>
        </div>
      </div>

      <nav class="bottom-nav">
        <button id="homeBtn" type="button" class="nav-item active"><span>⌂</span><small>Home</small></button>
        <button type="button" class="nav-item" disabled><span>◷</span><small>History</small></button>
      </nav>
    </section>
  </main>

  <script src="app.js?v=7"></script>
</body>
</html>
